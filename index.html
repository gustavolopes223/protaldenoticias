<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de noticias</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <header class="container">
            <nav id="primary" class="grid grid-flow-col">
            <div>
                <img src="assets/icons/List.svg" alt="Icone de menu">
                <strong>Menu</strong>
            </div>
            <div>
                <img src="assets/Tech News.svg" alt="Tech News logo">
            </div>
            <div>
                <strong>Buscar</strong>
                <img src="assets/icons/MagnifyingGlass.svg" alt="Icone de lupa">
            </div>
        </nav>
        <nav id="secundary" class="grid grid-flow-col">
            <a href="#">Inteligencia Artificial</a>

        </nav>
    </header>
    <main class="grid container">
        <section id="featured" class="grid grid-flow-col gap-16">
            <figure class="card">
                <img src="assets/image/Image 01.png" alt="robos">
                <figcaption>
                    <span class="content-tag">robotica</span>
                    <h2 class="text-2xl">
                        Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.
                    </h2>
                </figcaption>
            </figure>
            <figure class="grid grid-col-2 gap-16">
                <figure class="card">
                    <img src="assets/image/Image 02.png" alt="smartphone">
                    <figcaption>
                        <span class="content-tag">Hologramas</span>
                        <h3 class="text-lg">
                            Novo Smartphone Projetor 3D chega ao mercado, transformando a forma como vemos nossas telas!
                        </h3>
                    </figcaption>
                </figure>
                <figure class="card">
                    <img src="assets/image/Image 03.png" alt="5g">
                    <figcaption>
                        <span class="content-tag">Internet</span>
                        <h3 class="text-lg">
                            Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comuni...

                    </figcaption>
                </figure>
                <figure class="card">
                    <img src="assets/image/Image 04.png" alt="relogio">
                    <figcaption>
                        <span class="content-tag">Vestíveis</span>
                        <h3 class="text-lg">
                            Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o...
                        </h3>
                    </figcaption>
                </figure>
                <figure class="card">
                    <img src="assets/image/Image 05.png" alt="vr">
                    <figcaption>
                        <span class="content-tag">Realidade Virtual</span>
                        <h3 class="text-lg">
                           Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem trad... 
                        </h3>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
</body>
</html>
